[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version is derived from git tags via hatch-vcs (see [tool.hatch.version] below).
[project]
name = "Portale-von-Molthar"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "numpy >= 2.1.3",
    "open-spiel>=2.0.2",
    "scipy >= 1.14.1",
]
authors = [{ name = "Your Name" }]
description = "TBA"
readme = "README.md"
classifiers = ["Programming Language :: Python :: 3"]

[project.optional-dependencies]
cqa = [
    "ruff==0.14.13",
    "pre-commit==4.2.0",
    "pylint==3.3.9",
    "flake8==7.3.0",
    "flake8-errmsg==0.6.0",
    "flake8-pyproject==1.2.4",
    "nb-clean==4.0.1",
    "mypy==1.19.1",
    "bandit==1.9.3",
]

test = [
    "pytest==8.2.2",
    "coverage==7.9.1",
    "nbmake==1.5.4",
]

docs = [
    "sphinx==8.2.3",
    "matplotlib>=3.10.3",
    "sphinx-autoapi==3.0.0",
    "furo==2025.12.19",
    "sphinx-pyproject==0.3.0",
]

# All requirements needed for local development.
dev = ["portale_von_molthar[cqa, test, docs]"]

[tool.hatch.build.targets.wheel]
packages = ["src/portale_von_molthar"]

[tool.hatch.version]
source = "vcs"
# Used only when no git history/tags are reachable at all (e.g. an sdist built
# without a .git directory) -- not for the "no tag on HEAD" case, which instead
# yields a PEP 440 dev/post version derived from the nearest tag.
fallback-version = "0.0.1"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/portale_von_molthar/_version.py"

[tool.ruff]
extend-exclude = ["__init__.py"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "D107",  # undocumented __init__
    "EM101",  # Exception must not use a string literal, assign to variable first
    "FIX002",  # Line contains TODO, consider resolving the issue
    "G004",  # Logging statement uses f-string
    "PERF401",  # Use a list comprehension to create a transformed list
    "PLR2004",  # Magic value used in comparison
    "TD002",  # Missing author in TODO
    "TD003",  # Missing issue link for this TODO
    "TRY003"  # Avoid specifying long messages outside the exception class
]

[tool.ruff.format]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D103",
    "INP001",  # File ... is part of an implicit namespace package. Add an `__init__.py`.
    "S101"  # Use of `assert` detected
]
"examples/**" = [
    "INP001",  # File ... is part of an implicit namespace package. Add an `__init__.py`.
    "T201",  # print found
]
"docs/**" = [
    "INP001",  # File ... is part of an implicit namespace package. Add an `__init__.py`.
    "EXE002"  # The file is executable but no shebang is present
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pylint]
fail-under = 10.0

[tool.pylint.basic]
variable-rgx = "_|[a-z_][a-z0-9_]{1,}$"
inlinevar-rgx = "_|[a-z_][a-z0-9_]{1,}$"

[tool.pylint.main]
disable = ["all"]
enable = ["invalid-name"]
# Generated by the hatch-vcs build hook (see [tool.hatch.build.hooks.vcs]); not
# hand-written source, so it should not be subject to lint checks.
ignore = ["_version.py"]

# Only run error-message rules as this cannot be done by ruff
[tool.flake8]
select = [
    "EM",  # flake8-errmsg
]
extend-ignore = [
    "EM101",  # Exceptions must not use a string literal; assign to a variable first (also in ruff)
    "EM102",  # Check for raw usage of an f-string literal in Exception raising.
]

filename = [
    "src/**/*.py",
    "tests/*.py",
    "tests/**/*.py",
    "examples/*.py",
    "examples/**/*.py",
]

max-line-length = 100

# Global options of mypy, for additional keys check https://mypy.readthedocs.io/en/stable/config_file.html
[tool.mypy]

pretty = true
strict = true
exclude = "docs/_build/"

python_version = 3.11

# union-attr:       appears only in some of the unit tests; here, mypy misses the extension of
#                   Array/List to functions used in assertion commands
# import:           the build path for mypy is not the same as for python, therefore it is possible
#                   that some imports cannot be found; for us this is irrelevant
# index:            in our code there were many false positives and not a single case where this
#                   rule would have been useful
# no-any-return:    this rule is too strict for practial use; one effect of it is that it
#                   basically forbids to use the Any object altogether
# attr-defined:     mypy does not actually import any modules, but just follows the specified exports;
#                   for that reason, this rule generates an error everytime an export is not being
#                   made explicit; this behavior is not needed for us
# no-untyped-call:  is triggered by any imported module that uses untyped functions
disable_error_code = [
    "union-attr",
    "import",
    "index",
    "no-any-return",
    "attr-defined",
    "no-untyped-call",
    "type-arg",
]

# numpy/scipy ship PEP 695 `type` statements in their stubs, which mypy cannot
# parse while python_version is 3.11, aborting the strict check. Skip their
# stubs (treated as Any); follow_imports_for_stubs is required for .pyi files.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "scipy", "scipy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.coverage.run]
source = ["portale_von_molthar"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 0
omit = [
    "*/__init__.py",
]
exclude_lines = [
    "# pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["./tests", ".venv"]
